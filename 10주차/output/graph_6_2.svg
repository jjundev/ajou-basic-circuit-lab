  <rect class="legend-box" x="620" y="16" width="176" height="28" rx="6"/>
  <line class="i-line" x1="638" y1="30" x2="678" y2="30"/>
  <circle class="i-point" cx="658" cy="30" r="4.5"/>
  <text class="small" x="692" y="34">I_p-p</text>

