  <line class="tick" x1="239.6" y1="464" x2="239.6" y2="470"/>
  <line class="tick" x1="387.2" y1="464" x2="387.2" y2="470"/>
  <line class="tick" x1="534.8" y1="464" x2="534.8" y2="470"/>
  <line class="tick" x1="682.4" y1="464" x2="682.4" y2="470"/>
  <line class="tick" x1="830" y1="464" x2="830" y2="470"/>

