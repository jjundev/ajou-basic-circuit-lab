  <polyline class="i-line" points="165.8,264.08 239.6,171.96 387.2,117.08 534.8,105.32 682.4,99.44 830,95.52"/>

  <!-- Data points -->
  <circle class="i-point" cx="165.8" cy="264.08" r="4.5"/>
  <circle class="i-point" cx="239.6" cy="171.96" r="4.5"/>
  <circle class="i-point" cx="387.2" cy="117.08" r="4.5"/>
  <circle class="i-point" cx="534.8" cy="105.32" r="4.5"/>
  <circle class="i-point" cx="682.4" cy="99.44" r="4.5"/>
  <circle class="i-point" cx="830" cy="95.52" r="4.5"/>

