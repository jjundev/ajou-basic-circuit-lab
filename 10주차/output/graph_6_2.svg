<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Graph 6.2: Current vs Frequency</title>
  <desc id="desc">Line graph of I peak-to-peak versus frequency using Table 6.1 data for the series R-C network.</desc>
  <metadata>
    Data source: output/10주차_결과보고서.md Table 6.1
    Manual instruction source: input/book/20260426_201013.jpg, page 317, item (j)
    Frequency(kHz), I_p-p(mA)
    1, 1.02
    2, 1.49
    4, 1.77
    6, 1.83
    8, 1.86
    10, 1.88
  </metadata>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .plot-bg { fill: #fbfbfd; }
      .grid { stroke: #d7dbe3; stroke-width: 1; }
      .axis { stroke: #1f2937; stroke-width: 1.5; }
      .tick { stroke: #1f2937; stroke-width: 1; }
      .label { fill: #111827; font: 14px Arial, Helvetica, sans-serif; }
      .small { fill: #374151; font: 12px Arial, Helvetica, sans-serif; }
      .title { fill: #111827; font: 700 22px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #4b5563; font: 13px Arial, Helvetica, sans-serif; }
      .i-line { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .i-point { fill: #ffffff; stroke: #059669; stroke-width: 2.5; }
      .legend-box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .coord { fill: #047857; font: 12px Arial, Helvetica, sans-serif; paint-order: stroke; stroke: #ffffff; stroke-width: 4; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="560"/>

  <text class="title" x="92" y="36">Graph 6.2</text>
  <text class="subtitle" x="92" y="58">I_p-p versus frequency for the series R-C network</text>

  <rect class="plot-bg" x="92" y="72" width="738" height="392"/>

