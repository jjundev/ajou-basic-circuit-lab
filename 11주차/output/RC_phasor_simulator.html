<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>R-C 직렬 회로 페이저 시뮬레이터 — AC Ch 8 Part 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0d11;
    color: #e8e8ea;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 1280px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; }

  .controls {
    background: #18181d;
    padding: 18px 22px;
    border-radius: 12px;
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
    border: 1px solid #25252b;
  }
  .control-group label {
    display: block;
    font-size: 11px;
    color: #888;
    margin-bottom: 8px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] {
    flex: 1;
    accent-color: #4ade80;
    height: 4px;
  }
  .value {
    color: #4ade80;
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 13px;
    min-width: 90px;
    text-align: right;
    font-weight: 600;
  }

  .canvas-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 18px;
  }
  @media (max-width: 920px) { .canvas-grid { grid-template-columns: 1fr; } }
  .canvas-panel {
    background: #18181d;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #25252b;
  }
  .panel-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  canvas { width: 100%; display: block; }

  .stats {
    background: #18181d;
    border-radius: 12px;
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    border: 1px solid #25252b;
  }
  .stat {
    background: #0d0d11;
    padding: 12px 14px;
    border-radius: 8px;
    border-left: 3px solid #3b3b42;
  }
  .stat-label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .stat-value {
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 17px;
    color: #fff;
    font-weight: 500;
  }
  .stat.t1 { border-left-color: #fbbf24; }
  .stat.t1 .stat-value { color: #fbbf24; }
  .stat.t2 { border-left-color: #60a5fa; }
  .stat.t2 .stat-value { color: #60a5fa; }
  .stat.vr { border-left-color: #4ade80; }
  .stat.vc { border-left-color: #60a5fa; }

  .verify {
    margin-top: 16px;
    padding: 14px 16px;
    background: #0d0d11;
    border-radius: 8px;
    border: 1px solid #25252b;
    font-size: 13px;
    line-height: 1.8;
  }
  .ok { color: #4ade80; font-weight: 600; }
  .formula {
    font-family: 'SF Mono', 'Consolas', monospace;
    color: #e8e8ea;
  }
  .preset-row { margin-top: 10px; }
  .preset-btn {
    background: #25252b;
    color: #ccc;
    border: 1px solid #35353d;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
    margin-top: 6px;
    transition: all 0.15s;
  }
  .preset-btn:hover { background: #35353d; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>R-C 직렬 회로 페이저 시뮬레이터</h1>
    <div class="subtitle">AC Ch 8 Part 2 (Fig 8.2) — V_R, V_C, E의 위상 관계와 |θ₁| + |θ₂| = 90° 검증</div>
  </header>

  <div class="controls">
    <div class="control-group">
      <label>저항 R</label>
      <div class="slider-row">
        <input type="range" id="rSlider" min="100" max="5000" value="1000" step="50">
        <span class="value" id="rValue">1000 Ω</span>
      </div>
      <div class="preset-row">
        <button class="preset-btn" onclick="setPreset(1000, 10, 10000)">교재 기본 (1kΩ, 10nF, 10kHz)</button>
        <button class="preset-btn" onclick="setPreset(3300, 10, 10000)">R=3.3kΩ</button>
        <button class="preset-btn" onclick="setPreset(6800, 10, 10000)">R=6.8kΩ</button>
      </div>
    </div>
    <div class="control-group">
      <label>커패시터 C</label>
      <div class="slider-row">
        <input type="range" id="cSlider" min="1" max="100" value="10" step="1">
        <span class="value" id="cValue">10 nF</span>
      </div>
    </div>
    <div class="control-group">
      <label>주파수 f</label>
      <div class="slider-row">
        <input type="range" id="fSlider" min="100" max="20000" value="10000" step="100">
        <span class="value" id="fValue">10.0 kHz</span>
      </div>
    </div>
  </div>

  <div class="canvas-grid">
    <div class="canvas-panel">
      <div class="panel-title">페이저 다이어그램 (I 기준, V_R = +x 방향)</div>
      <canvas id="phasor"></canvas>
    </div>
    <div class="canvas-panel">
      <div class="panel-title">Dual-Trace 시간 영역 파형 (E 기준)</div>
      <canvas id="waveform"></canvas>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">X_C = 1/(2πfC)</div>
      <div class="stat-value" id="xcValue">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">|Z| = √(R² + X_C²)</div>
      <div class="stat-value" id="zValue">—</div>
    </div>
    <div class="stat t1">
      <div class="stat-label">θ₁ (E ↔ V_R)</div>
      <div class="stat-value" id="t1Value">—</div>
    </div>
    <div class="stat t2">
      <div class="stat-label">θ₂ (E ↔ V_C)</div>
      <div class="stat-value" id="t2Value">—</div>
    </div>
    <div class="stat vr">
      <div class="stat-label">V_R (peak)</div>
      <div class="stat-value" id="vrValue">—</div>
    </div>
    <div class="stat vc">
      <div class="stat-label">V_C (peak)</div>
      <div class="stat-value" id="vcValue">—</div>
    </div>
  </div>

  <div class="verify" id="verify"></div>
</div>

<script>
const rSlider = document.getElementById('rSlider');
const cSlider = document.getElementById('cSlider');
const fSlider = document.getElementById('fSlider');
const phasorCanvas = document.getElementById('phasor');
const waveformCanvas = document.getElementById('waveform');

function setPreset(r, c, f) {
  rSlider.value = r;
  cSlider.value = c;
  fSlider.value = f;
  update();
}

function setupCanvas(canvas, aspectRatio = 1) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.width / aspectRatio;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function update() {
  const R = +rSlider.value;
  const Cnf = +cSlider.value;
  const Cf = Cnf * 1e-9;
  const f = +fSlider.value;

  const Xc = 1 / (2 * Math.PI * f * Cf);
  const Z = Math.sqrt(R*R + Xc*Xc);
  const theta1 = Math.atan(Xc / R) * 180 / Math.PI;
  const theta2 = 90 - theta1;

  const E = 2; // 4 V_pp / 2
  const I = E / Z;
  const Vr = I * R;
  const Vc = I * Xc;

  document.getElementById('rValue').textContent = (R >= 1000 ? (R/1000).toFixed(2) + ' kΩ' : R + ' Ω');
  document.getElementById('cValue').textContent = (Cnf >= 1000 ? (Cnf/1000).toFixed(2) + ' μF' : Cnf + ' nF');
  document.getElementById('fValue').textContent = (f >= 1000 ? (f/1000).toFixed(1) + ' kHz' : f + ' Hz');
  document.getElementById('xcValue').textContent = Xc >= 1000 ? (Xc/1000).toFixed(2) + ' kΩ' : Xc.toFixed(0) + ' Ω';
  document.getElementById('zValue').textContent = Z >= 1000 ? (Z/1000).toFixed(2) + ' kΩ' : Z.toFixed(0) + ' Ω';
  document.getElementById('t1Value').textContent = theta1.toFixed(2) + '°';
  document.getElementById('t2Value').textContent = theta2.toFixed(2) + '°';
  document.getElementById('vrValue').textContent = Vr.toFixed(3) + ' V';
  document.getElementById('vcValue').textContent = Vc.toFixed(3) + ' V';

  const phasorSum = Math.sqrt(Vr*Vr + Vc*Vc);
  document.getElementById('verify').innerHTML =
    `<div><span class="formula">|θ₁| + |θ₂| = ${theta1.toFixed(2)}° + ${theta2.toFixed(2)}° = <b>${(theta1+theta2).toFixed(2)}°</b></span> <span class="ok">✓ 항상 90° (V_R ⊥ V_C)</span></div>` +
    `<div><span class="formula">√(V_R² + V_C²) = √(${Vr.toFixed(3)}² + ${Vc.toFixed(3)}²) = <b>${phasorSum.toFixed(3)} V</b></span> <span class="ok">≈ E = ${E.toFixed(2)} V (KVL 페이저 합)</span></div>`;

  drawPhasor(theta1, Vr, Vc, E);
  drawWaveform(theta1);
}

function drawPhasor(theta1, Vr, Vc, E) {
  const { ctx, w, h } = setupCanvas(phasorCanvas, 1);
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const margin = 50;
  const maxR = Math.min(w, h) / 2 - margin;
  const maxV = Math.max(Vr, Vc, E) * 1.15;
  const scale = maxR / maxV;

  // grid circles
  ctx.strokeStyle = '#23232a';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR * i / 4, 0, 2*Math.PI);
    ctx.stroke();
  }

  // axes
  ctx.strokeStyle = '#3a3a42';
  ctx.beginPath();
  ctx.moveTo(margin/2, cy); ctx.lineTo(w - margin/2, cy);
  ctx.moveTo(cx, margin/2); ctx.lineTo(cx, h - margin/2);
  ctx.stroke();

  // axis labels
  ctx.fillStyle = '#666';
  ctx.font = '11px sans-serif';
  ctx.fillText('Re (I 방향)', w - 75, cy - 6);
  ctx.fillText('Im', cx + 6, margin/2 + 8);

  // 90° square between V_R and V_C
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  const sq = 14;
  ctx.beginPath();
  ctx.moveTo(cx + sq, cy);
  ctx.lineTo(cx + sq, cy + sq);
  ctx.lineTo(cx, cy + sq);
  ctx.stroke();

  // V_R phasor (along +x, in phase with I)
  drawArrow(ctx, cx, cy, cx + Vr * scale, cy, '#4ade80', 'V_R', 'right');

  // V_C phasor (along -y in phasor convention = +y on screen since y inverted)
  drawArrow(ctx, cx, cy, cx, cy + Vc * scale, '#60a5fa', 'V_C', 'down');

  // E phasor (sum) — direction: +x, +y on screen (4th quadrant in math = lagging)
  const Ex = cx + Vr * scale;
  const Ey = cy + Vc * scale;
  drawArrow(ctx, cx, cy, Ex, Ey, '#fbbf24', 'E', 'diag');

  // dashed lines completing parallelogram
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(cx + Vr * scale, cy);
  ctx.lineTo(Ex, Ey);
  ctx.moveTo(cx, cy + Vc * scale);
  ctx.lineTo(Ex, Ey);
  ctx.stroke();
  ctx.setLineDash([]);

  // angle arc for θ_1 (between V_R/+x and E)
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  const arcR1 = 38;
  ctx.beginPath();
  ctx.arc(cx, cy, arcR1, 0, theta1 * Math.PI / 180);
  ctx.stroke();
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 13px sans-serif';
  const labAng1 = (theta1 / 2) * Math.PI / 180;
  ctx.fillText('θ₁', cx + (arcR1 + 10) * Math.cos(labAng1) - 6, cy + (arcR1 + 10) * Math.sin(labAng1) + 4);

  // angle arc for θ_2 (between E and V_C)
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 2;
  const arcR2 = arcR1 + 18;
  ctx.beginPath();
  ctx.arc(cx, cy, arcR2, theta1 * Math.PI / 180, 90 * Math.PI / 180);
  ctx.stroke();
  ctx.fillStyle = '#60a5fa';
  const labAng2 = ((theta1 + 90) / 2) * Math.PI / 180;
  ctx.fillText('θ₂', cx + (arcR2 + 10) * Math.cos(labAng2) - 6, cy + (arcR2 + 10) * Math.sin(labAng2) + 4);
}

function drawArrow(ctx, x1, y1, x2, y2, color, label, labelPos) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  const angle = Math.atan2(y2 - y1, x2 - x1);
  const headSize = 11;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headSize * Math.cos(angle - Math.PI/6), y2 - headSize * Math.sin(angle - Math.PI/6));
  ctx.lineTo(x2 - headSize * Math.cos(angle + Math.PI/6), y2 - headSize * Math.sin(angle + Math.PI/6));
  ctx.closePath();
  ctx.fill();

  ctx.font = 'bold 14px sans-serif';
  let lx, ly;
  if (labelPos === 'right')      { lx = x2 + 10; ly = y2 - 6; }
  else if (labelPos === 'down')  { lx = x2 + 8;  ly = y2 + 4; }
  else                            { lx = x2 + 10; ly = y2 + 6; }
  ctx.fillText(label, lx, ly);
}

function drawWaveform(theta1) {
  const { ctx, w, h } = setupCanvas(waveformCanvas, 1);
  ctx.clearRect(0, 0, w, h);

  const padding = 36;
  const plotW = w - 2 * padding;
  const plotH = h - 2 * padding - 24;
  const cy = padding + 12 + plotH / 2;

  // grid
  ctx.strokeStyle = '#23232a';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 4]);
  for (let i = 1; i <= 4; i++) {
    const yt = cy - (plotH/2) * (i/4);
    const yb = cy + (plotH/2) * (i/4);
    ctx.beginPath(); ctx.moveTo(padding, yt); ctx.lineTo(w-padding, yt); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padding, yb); ctx.lineTo(w-padding, yb); ctx.stroke();
  }
  for (let i = 1; i <= 8; i++) {
    const x = padding + plotW * (i/8);
    ctx.beginPath(); ctx.moveTo(x, padding+12); ctx.lineTo(x, h-padding); ctx.stroke();
  }
  ctx.setLineDash([]);

  // axes
  ctx.strokeStyle = '#3a3a42';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padding, cy); ctx.lineTo(w - padding, cy);
  ctx.moveTo(padding, padding+12); ctx.lineTo(padding, h - padding);
  ctx.stroke();

  ctx.fillStyle = '#666';
  ctx.font = '11px sans-serif';
  ctx.fillText('t', w - padding + 4, cy + 4);
  ctx.fillText('V', padding - 12, padding + 8);

  const cycles = 2;
  const amp = plotH / 2 - 6;

  // E (yellow) — reference
  drawSine(ctx, padding, cy, plotW, amp, cycles, 0, '#fbbf24', 2.5);
  // V_R (green) — leads E by theta1
  drawSine(ctx, padding, cy, plotW, amp * 0.7, cycles, theta1, '#4ade80', 2);
  // V_C (blue) — lags E by (90 - theta1) = theta2
  drawSine(ctx, padding, cy, plotW, amp * 0.7, cycles, -(90 - theta1), '#60a5fa', 2);

  // legend
  const lY = padding;
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(padding, lY-2, 14, 3); ctx.fillText('E (기준)', padding+20, lY+3);
  ctx.fillStyle = '#4ade80'; ctx.fillRect(padding+90, lY-2, 14, 3); ctx.fillText('V_R (+θ₁ leading)', padding+110, lY+3);
  ctx.fillStyle = '#60a5fa'; ctx.fillRect(padding+240, lY-2, 14, 3); ctx.fillText('V_C (−θ₂ lagging)', padding+260, lY+3);
}

function drawSine(ctx, x0, y0, width, amp, cycles, phaseDeg, color, lineW) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lineW;
  ctx.beginPath();
  const phaseRad = phaseDeg * Math.PI / 180;
  const samples = 400;
  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const x = x0 + t * width;
    const y = y0 - amp * Math.sin(2 * Math.PI * cycles * t + phaseRad);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

[rSlider, cSlider, fSlider].forEach(s => s.addEventListener('input', update));
window.addEventListener('resize', update);
update();
</script>
</body>
</html>
