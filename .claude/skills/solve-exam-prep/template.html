<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' },
    startup: {
      ready: () => {
        MathJax.startup.defaultReady();
        MathJax.startup.promise.then(() => { window.__mathjaxDone = true; });
      }
    }
  };
</script>
<script src="{{MATHJAX_SRC}}" id="MathJax-script" async></script>
<style>
  /* Bundled Pretendard (variable) so the intended 300/400/500/600 weights
     render even when the system has no Pretendard. Without this, Windows falls
     back to Malgun Gothic (only 400 + 700), so every 600-weight <strong>/heading
     jumps straight to full bold — the "글씨가 갑자기 두꺼워지는" symptom. */
  @font-face {
    font-family: 'Pretendard';
    font-weight: 45 920;
    font-style: normal;
    font-display: block;
    src: local('Pretendard Variable'), local('Pretendard'),
         url('{{FONT_SRC}}') format('woff2-variations');
  }
  @page { size: A4; margin: 18mm 16mm 20mm 16mm; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #fff; color: #111;
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 10.5pt; line-height: 1.65;
  }

  /* Header */
  .doc-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 4mm; margin-bottom: 7mm;
    border-bottom: 1px solid #1a1a1a;
  }
  .doc-header .label {
    font-size: 7.5pt; letter-spacing: 0.45em; color: #888; margin-bottom: 2.5mm;
  }
  .doc-header .title { font-size: 20pt; font-weight: 300; line-height: 1.05; letter-spacing: -0.01em; }
  .doc-header .meta { text-align: right; font-size: 8.5pt; color: #666; line-height: 1.5; }
  .doc-header .meta .course { color: #111; font-weight: 500; }

  /* Content */
  .content h2 {
    font-size: 13pt; font-weight: 600; margin: 9mm 0 3mm;
    padding-bottom: 1.5mm; border-bottom: 1px solid #ddd;
  }
  .content h2:first-child { margin-top: 0; }
  .content h3 { font-size: 11pt; font-weight: 600; margin: 6mm 0 2mm; color: #222; }
  .content p { margin: 2.5mm 0; }
  .content ul, .content ol { margin: 2.5mm 0; padding-left: 6mm; }
  .content li { margin: 1mm 0; }
  .content strong { font-weight: 600; }

  /* Given/Find · callout box */
  .callout {
    background: #f7f7f7; border-left: 3px solid #1a1a1a;
    padding: 3mm 4mm; margin: 3mm 0; font-size: 10pt;
  }
  .summary {
    border: 1px solid #1a1a1a; padding: 3.5mm 4mm; margin: 5mm 0 2mm;
    font-weight: 500;
  }

  /* Tables */
  table { width: 100%; border-collapse: collapse; margin: 3mm 0; font-size: 9.5pt; }
  th, td { border: 1px solid #ccc; padding: 1.8mm 2.5mm; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; font-weight: 600; }

  /* Math display spacing */
  mjx-container[display="true"] { margin: 3mm 0 !important; }

  /* Footer — repeats on every printed page in Chromium */
  .doc-footer {
    position: fixed; bottom: 6mm; left: 16mm; right: 16mm;
    font-size: 7.5pt; color: #999; text-align: center;
    border-top: 1px solid #eee; padding-top: 1.5mm;
  }
  .page-break { break-before: page; }
</style>
</head>
<body>
  <div class="doc-header">
    <div class="left">
      <div class="label">EXAM SOLUTION</div>
      <div class="title">{{TITLE}}</div>
    </div>
    <div class="meta">
      <div class="course">기초전기실험 · 기말고사 대비</div>
      <div>{{DATE}}</div>
    </div>
  </div>

  <div class="content">
{{CONTENT}}
  </div>

  <div class="doc-footer">기말고사 대비 풀이 — 학습용</div>
</body>
</html>
